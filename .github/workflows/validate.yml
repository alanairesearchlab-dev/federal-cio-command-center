name: Validate static application

on:
  push:
    paths:
      - '*.html'
      - 'scripts/**'
      - '.github/workflows/validate.yml'
  pull_request:
    paths:
      - '*.html'
      - 'scripts/**'
      - '.github/workflows/validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate Python syntax
        run: python -m compileall -q scripts
      - name: Validate inline JavaScript and navigation
        run: python scripts/validate_static.py
      - name: Install browser test dependency
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser runtime smoke test
        run: node scripts/smoke.cjs
